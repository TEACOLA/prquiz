<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sources List - PR Quiz (prquiz.com)</title>
  <meta name="description" content="List of recent press release sources (Newswire &amp; PR TIMES) featured on PR Quiz.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
</head>
<body>

  <!-- サイト共通ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-area">
        <div class="logo-text">Press Release <span>Quiz</span></div>
      </a>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="page-title-area">
      <h1 id="page-title" class="page-title">📰 Press Release Sources</h1>
      <p id="page-desc" class="page-desc">
        Here is the list of recent press releases used in PR Quiz. Click any article to read the full story on Newswire.
      </p>
    </div>

    <!-- ソース元リストコンテナ -->
    <div id="sources-list" class="sources-list">
      <div class="loading-indicator">
        <div class="spinner"></div>
        <p>Fetching press release sources...</p>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-item">
      <a href="index.html" class="footer-link-main">prquiz.com</a>
      <a href="https://teacola.github.io/" target="_blank" rel="noopener noreferrer" class="footer-link-author">by me</a>
    </div>
    <div class="footer-item">
      <!-- 言語切り替え -->
      <div class="lang-switch" role="group" aria-label="Language selection">
        <button class="lang-btn active" data-lang="en">🇺🇸 English</button>
        <button class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
      </div>
    </div>
    <div class="footer-item">
      <a href="sources.html" id="footer-sources-link" class="footer-link-sub">Press Release Sources List</a>
    </div>
    <div class="footer-item footer-score" id="footer-score">
      Score: 0 / Answers: 0 (Accuracy: 0%)
    </div>
  </footer>

  <script src="sources.js"></script>
</body>
</html>
