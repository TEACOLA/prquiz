<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ソース元一覧 - PR Quiz (prquiz.com)</title>
  <meta name="description" content="PR Quizで出題されているプレスリリースのソース元（PR TIMES・Newswire）の一覧です。">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
</head>
<body>

  <!-- サイト共通ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-area">
        <span class="logo-icon">🍎</span>
        <div class="logo-text">PR<span>Quiz</span></div>
      </a>

      <div class="header-actions">
        <!-- 言語切り替え -->
        <div class="lang-switch" role="group" aria-label="Language selection">
          <button class="lang-btn active" data-lang="ja">🇯🇵 日本語</button>
          <button class="lang-btn" data-lang="en">🇺🇸 English</button>
        </div>

        <!-- クイズ画面へ戻るリンク -->
        <a href="index.html" class="nav-link">
          🍎 <span>クイズへ戻る</span>
        </a>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="page-title-area">
      <h1 id="page-title" class="page-title">📰 プレスリリース ソース元一覧</h1>
      <p id="page-desc" class="page-desc">
        PR Quizで出題されている最新のプレスリリース一覧です。気になるタイトルの記事は、元サイト（PR TIMES / Newswire）で全文をお読みいただけます。
      </p>
    </div>

    <!-- ソース元リストコンテナ -->
    <div id="sources-list" class="sources-list">
      <div class="loading-indicator">
        <div class="spinner"></div>
        <p>プレスリリース一覧を取得中...</p>
      </div>
    </div>
  </main>

  <!-- フッター（スクロール追従 / 3行表示） -->
  <footer class="site-footer">
    <div class="footer-item">
      <a href="index.html" class="footer-link-main">prquiz.com</a>
    </div>
    <div class="footer-item">
      <a href="sources.html" id="footer-sources-link" class="footer-link-sub">プレスリリースのソース元サイト一覧</a>
    </div>
    <div class="footer-item footer-score" id="footer-score">
      正解数: 0 / 回答数: 0 (正解率: 0%)
    </div>
  </footer>

  <script src="sources.js"></script>
</body>
</html>
