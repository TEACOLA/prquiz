<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ソース元一覧 - PR Quiz (prquiz.com)</title>
  <meta name="description" content="PR Quizで出題されているプレスリリースのソース元（任天堂・いらすとや・マルちゃん・デイリーポータルZ・ニッセイ基礎研・JAXA・総務省・経産省・産総研・理研・Google・OpenAI・NASA・官公庁等）の一覧です。">
  <!-- ブラウザによる自動翻訳でタイトルが勝手に変換されるのを防ぐ -->
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="style.css?v=13">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0077873067570601"
     crossorigin="anonymous"></script>
</head>
<body>

  <!-- サイト共通ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-area">
        <div class="logo-text"><span class="logo-initial">P</span>RESS <span class="logo-initial">R</span>ELEASE <span class="logo-quiz"><span class="logo-initial">Q</span>UIZ</span></div>
      </a>
      <div id="header-accuracy" class="header-accuracy">正解率: 0%</div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <!-- 問題更新日時バー（ヘッダーとコンテンツの間） -->
    <div class="update-time-bar">
      <span class="update-icon">🕒</span>
      <span id="update-time-text" class="update-time-text">問題更新日時: 読み込み中...</span>
    </div>

    <div class="page-title-area">
      <h1 id="page-title" class="page-title">📰 プレスリリース ソース元一覧</h1>
      <p id="page-desc" class="page-desc">
        PR Quizで出題されている最新のプレスリリース一覧です。気になるタイトルの記事は、<a href="#feeds-section" class="desc-feed-link">元サイト</a>で全文をお読みいただけます。
      </p>
    </div>

    <!-- ソース元リストコンテナ -->
    <div id="sources-list" class="sources-list notranslate" translate="no">
      <div class="loading-indicator">
        <div class="spinner"></div>
        <p>プレスリリース一覧を取得中...</p>
      </div>
    </div>

    <!-- 配信元RSS/RDFフィード一覧 -->
    <section id="feeds-section" class="feeds-section notranslate" translate="no">
      <div class="feeds-card">
        <div class="feeds-header">
          <h2 id="feeds-title" class="feeds-title">📡 利用している公式RSS/RDFフィード一覧</h2>
          <p id="feeds-desc" class="feeds-desc">
            PR Quiz では、各機関・メディアが一般公開している公式フィードを取得し、クイズの問題として活用させていただいています。
          </p>
        </div>
        <div id="feeds-grid" class="feeds-grid">
          <!-- JavaScriptで動的生成 -->
        </div>
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-item">
      <a href="index.html" class="footer-link-main">PRQuiz.com</a>
    </div>
    <div class="footer-item">
      <a href="https://teacola.github.io/" target="_blank" rel="noopener noreferrer" class="footer-link-author">by TeaCola</a>
    </div>
    <div class="footer-item">
      <!-- 言語切り替え -->
      <div class="lang-switch" role="group" aria-label="Language selection">
        <button class="lang-btn active" data-lang="ja">🇯🇵 日本語</button>
        <button class="lang-btn" data-lang="en">🇺🇸 English</button>
      </div>
    </div>
    <div class="footer-item">
      <a href="sources.html" id="footer-sources-link" class="footer-link-sub">プレスリリースのソース元サイト一覧</a>
    </div>
    <div class="footer-item footer-score" id="footer-score">
      正解数: 0 / 回答数: 0（正解率: 0%）
    </div>
  </footer>

  <script src="sources.js?v=10"></script>
</body>
</html>
