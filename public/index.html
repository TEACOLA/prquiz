<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR Quiz (prquiz.com) - プレスリリース伏字クイズ</title>
  <meta name="description" content="最新のプレスリリースから1文字が🍎に伏字化されたクイズに挑戦！ヒントを押せば元記事へアクセスできます。">
  <!-- ブラウザによる自動翻訳でクイズが破綻するのを防ぐ -->
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
</head>
<body>

  <!-- サイト共通ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-area">
        <div class="logo-text"><span class="logo-initial">P</span>RESS <span class="logo-initial">R</span>ELEASE <span class="logo-quiz"><span class="logo-initial">Q</span>UIZ</span></div>
      </a>
      <div id="header-accuracy" class="header-accuracy">正解率: 0%</div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <!-- 問題更新日時バー（ヘッダーと問題文エリアの間） -->
    <div class="update-time-bar">
      <span class="update-icon">🕒</span>
      <span id="update-time-text" class="update-time-text">問題更新日時: 読み込み中...</span>
    </div>

    <div class="quiz-card notranslate" translate="no">
      <!-- 問題文表示エリア -->
      <div class="question-container">
        <span id="question-label" class="question-label">問題（🍎に入る文字は？）</span>
        <div id="question-text" class="question-text">
          <div class="loading-indicator">
            <div class="spinner"></div>
            <p>プレスリリースを取得しています...</p>
          </div>
        </div>
      </div>

      <!-- ヒントエリア -->
      <div class="hint-area">
        <button id="hint-toggle-btn" class="hint-toggle-btn" type="button">
          💡 ヒントを見る
        </button>
        <div id="hint-box" class="hint-box">
          <div id="hint-notice" style="font-weight: 700; margin-bottom: 4px;">ヒント（元記事はこちら）:</div>
          <p id="hint-subtext" style="font-size: 0.88rem; margin-bottom: 6px;">プレスリリースの元記事に答えが載っています！</p>
          <a id="hint-link" class="hint-link" href="#" target="_blank" rel="noopener noreferrer">
            元記事を開く ↗
          </a>
        </div>
      </div>

      <!-- 3択選択肢エリア -->
      <div id="choices-container" class="choices-container">
        <!-- JavaScriptで動的生成 -->
      </div>

      <!-- 回答結果表示エリア -->
      <div id="result-box" class="result-box">
        <div id="result-title" class="result-title"></div>
        <div id="result-detail" class="result-detail"></div>
        <div id="result-original-label" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">▼ 元のタイトル:</div>
        <div id="result-original-title" class="result-original-title"></div>
        <div style="margin-top: 14px;">
          <a id="result-link" class="result-link" href="#" target="_blank" rel="noopener noreferrer">
            記事の全文を元サイトで読む ↗
          </a>
        </div>
      </div>

      <!-- 「次の問題へ」ボタン -->
      <div class="action-area">
        <button id="next-btn" class="next-btn" type="button">
          次の問題へ &rarr;
        </button>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-item">
      <a href="index.html" class="footer-link-main">PRQuiz.com</a>
    </div>
    <div class="footer-item">
      <a href="https://teacola.github.io/" target="_blank" rel="noopener noreferrer" class="footer-link-author">by TeaCola</a>
    </div>
    <div class="footer-item">
      <!-- 言語切り替え -->
      <div class="lang-switch" role="group" aria-label="Language selection">
        <button class="lang-btn active" data-lang="ja">🇯🇵 日本語</button>
        <button class="lang-btn" data-lang="en">🇺🇸 English</button>
      </div>
    </div>
    <div class="footer-item">
      <a href="sources.html" id="footer-sources-link" class="footer-link-sub">プレスリリースのソース元サイト一覧</a>
    </div>
    <div class="footer-item footer-score" id="footer-score">
      正解数: 0 / 回答数: 0（正解率: 0%）
    </div>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
